<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071825">
  <title>海洋生物入侵 · TTgames</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./phaser.min.js" defer></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="app">
    <div id="game" aria-label="海洋生物入侵战场"></div>
    <div id="hud" hidden></div>
    <div id="controls" hidden>
      <div id="stick-area" aria-hidden="true"><div id="joystick"><i></i></div></div>
      <button type="button" data-control="shop" data-action="shop">商店</button>
      <button type="button" data-control="pause" data-action="pause" aria-label="暂停">Ⅱ</button>
      <button type="button" data-control="auto" data-action="auto">自动</button>
      <button type="button" data-control="skill3" data-skill="3" hidden>飞镖</button>
      <button type="button" data-control="skill2" data-skill="2" hidden>激光</button>
      <button type="button" data-control="skill1" data-skill="1">技能二</button>
      <button type="button" data-control="skill0" data-skill="0">手雷</button>
      <button type="button" data-control="attack" id="fire">射击</button>
      <div id="loadout"></div>
    </div>
    <div id="screen"><div class="panel loading" role="status">正在加载海洋生物入侵…</div></div>
  </main>
</body>
</html>
